name: Release

# Build static OpenWrt-friendly binaries for version tags.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabi

    steps:
      - uses: actions/checkout@v7
      - name: Build static binary
        uses: houseabsolute/actions-rust-cross@v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true
      - name: Package and checksum
        run: |
          archive="hust-network-login-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" hust-network-login
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hust-network-login-${{ matrix.target }}.tar.gz
            hust-network-login-${{ matrix.target }}.tar.gz.sha256

  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Windows executable
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell syntax validation failed: $($_.Name)"
            }
          }
      - name: Package and checksum
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $stage = Join-Path $PWD "windows-package"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target\$target\release\hust-network-login.exe" $stage
          Copy-Item "windows\*.ps1" $stage
          Copy-Item "windows\README.md" (Join-Path $stage "README-Windows.md")
          $archive = "hust-network-login-$target.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive -Force
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
      - name: Publish Windows release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hust-network-login-x86_64-pc-windows-msvc.zip
            hust-network-login-x86_64-pc-windows-msvc.zip.sha256
